<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExamTopics Viewer</title>
  <meta name="description" content="Study ExamTopics questions with community consensus answers and discussion." />
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">
      <img src="/static/img/logo.svg" width="24" height="24" alt="" />
      <span>ExamTopics Viewer</span>
    </a>

    <nav class="tabs" aria-label="Study mode">
      <button id="btnCards" class="tab active">Cards</button>
      <button id="btnFeed"  class="tab">Feed</button>
      <button id="btnExam"  class="tab">Exam</button>
    </nav>

    <div class="topbar-spacer"></div>

    <div class="jump-wrap">
      <label class="jump-label" for="jumpInput">Go to</label>
      <input id="jumpInput" class="jump-input" type="number" min="1" placeholder="#" />
      <span id="jumpTotal" class="jump-total"></span>
    </div>

    <select id="fileSelect" class="file-select" aria-label="Exam">
      <option value="">Loading…</option>
    </select>

    <div class="topbar-tools">
      <button id="btnHistory" class="icon-btn" aria-label="Exam history" title="Exam history">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </button>
      <button id="btnDownload" class="icon-btn" aria-label="Add an exam" title="Add an exam">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button id="themeToggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">
        <span id="themeIcon"></span>
      </button>
    </div>
  </header>

  <main>
    <div id="view" class="card-wrap">
      <div class="state-loading">
        <div class="spinner"></div>
        <p>Loading questions…</p>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
